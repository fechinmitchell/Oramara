# oramara/render.yaml
# Render Blueprint: makes the FieldFalcon backend and its Postgres database in one go.
# In Render: New > Blueprint > pick this repo. It asks for the values marked sync: false.
databases:
  - name: oramara-db
    databaseName: oramara
    region: frankfurt
    plan: basic-256mb

services:
  - type: web
    name: oramara-api
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: oramara-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://oramara.vercel.app
      - key: PORTAL_URL
        value: https://oramara.vercel.app
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
